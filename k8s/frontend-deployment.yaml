apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: resolveit
  labels:
    app: resolveit-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resolveit-frontend
  template:
    metadata:
      labels:
        app: resolveit-frontend
    spec:
      containers:
        - name: frontend
          image: resolveituser/resolveit-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
