apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: resolveit
  labels:
    app: resolveit-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resolveit-backend
  template:
    metadata:
      labels:
        app: resolveit-backend
    spec:
      containers:
        - name: backend
          image: resolveituser/resolveit-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: resolveit-config
            - secretRef:
                name: resolveit-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
