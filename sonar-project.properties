# SonarQube Project Configuration for ResolveIT
sonar.projectKey=resolveit-complaint-system
sonar.projectName=ResolveIT – Complaint Management System
sonar.projectVersion=1.0.0

# Sources and Tests
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/uploads/**,**/coverage/**

# Language specific settings
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality Gate Settings
sonar.qualitygate.wait=true
